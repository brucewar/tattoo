name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tattoo
          POSTGRES_PASSWORD: tattoo_test
          POSTGRES_DB: tattoo_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U tattoo -d tattoo_test"
          --health-interval 5s --health-timeout 5s --health-retries 15
    env:
      TEST_DATABASE_URL: postgresql://tattoo:tattoo_test@127.0.0.1:5432/tattoo_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:integration
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Browser checks for accounts, editor, revisions and preview
        run: node tests/e2e/run-p2.mjs
      - run: npm run setup
      - run: docker compose config --quiet
      - run: docker compose build
      - run: node scripts/verify-foundation.mjs
