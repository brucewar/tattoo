name: 功能建议
description: 描述你希望 Tattoo 解决的问题
body:
  - type: markdown
    attributes:
      value: |
        可以先查看[当前功能和后续范围](https://github.com/brucewar/tattoo#使用前了解)，以及已有 Issue。
  - type: textarea
    id: problem
    attributes:
      label: 你想解决什么问题？
      description: 描述实际使用场景、遇到的困难，以及现在如何处理。
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: 你希望有什么结果？
      description: 可以举一个输入、操作和期望结果的例子。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 其他方案或补充材料（可选）
      description: 相关项目、替代做法或使用演示数据的示意图。
