name: tattoo
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tattoo
      POSTGRES_USER: tattoo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U tattoo -d tattoo']
      interval: 5s
      timeout: 5s
      retries: 15
    restart: unless-stopped
  api:
    image: ${TATTOO_IMAGE:-ghcr.io/brucewar/tattoo:${TATTOO_VERSION:-0.1.0-rc.1}}
    ports:
      - '${WEB_PORT:-8080}:3000'
    environment: &application-environment
      NODE_ENV: production
      DATABASE_URL: postgresql://tattoo:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/tattoo
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:?Set APP_ENCRYPTION_KEY in .env}
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:8080}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      STORAGE_PATH: /data/assets
      REMOTE_WRITES_ENABLED: ${REMOTE_WRITES_ENABLED:-false}
    volumes:
      - assets:/data/assets
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://localhost:3000/api/v1/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 15s
    restart: unless-stopped
  worker:
    image: ${TATTOO_IMAGE:-ghcr.io/brucewar/tattoo:${TATTOO_VERSION:-0.1.0-rc.1}}
    command: [node, apps/server/dist/worker.js]
    environment: *application-environment
    volumes:
      - assets:/data/assets
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "const fs=require('node:fs');try{process.exit(Date.now()-fs.statSync('/tmp/tattoo-worker-health').mtimeMs<20000?0:1)}catch{process.exit(1)}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
volumes:
  database:
  assets:
