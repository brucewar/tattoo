name: tattoo
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tattoo
      POSTGRES_USER: tattoo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run npm run setup first}
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U tattoo -d tattoo']
      interval: 5s
      timeout: 5s
      retries: 15
    restart: unless-stopped
  api:
    image: tattoo-app:${TATTOO_VERSION:-local}
    build:
      context: .
      target: application
    environment: &application-environment
      NODE_ENV: production
      DATABASE_URL: postgresql://tattoo:${POSTGRES_PASSWORD:?Run npm run setup first}@postgres:5432/tattoo
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:?Run npm run setup first}
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:8080}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      STORAGE_PATH: /data/assets
      REMOTE_WRITES_ENABLED: ${REMOTE_WRITES_ENABLED:-false}
    volumes:
      - assets:/data/assets
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://localhost:3000/api/v1/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 15s
    restart: unless-stopped
  worker:
    image: tattoo-app:${TATTOO_VERSION:-local}
    command: [node, apps/server/dist/worker.js]
    environment: *application-environment
    volumes:
      - assets:/data/assets
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "const fs=require('node:fs');try{process.exit(Date.now()-fs.statSync('/tmp/tattoo-worker-health').mtimeMs<20000?0:1)}catch{process.exit(1)}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
  web:
    image: tattoo-web:${TATTOO_VERSION:-local}
    build:
      context: .
      target: web
    ports:
      - '${WEB_PORT:-8080}:8080'
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: [CMD-SHELL, 'wget -q -O /dev/null http://127.0.0.1:8080/']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
volumes:
  database:
  assets:
