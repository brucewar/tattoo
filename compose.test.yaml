name: tattoo-tests
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tattoo
      POSTGRES_PASSWORD: tattoo_test
      POSTGRES_DB: tattoo_test
    ports:
      - '127.0.0.1:55432:5432'
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U tattoo -d tattoo_test']
      interval: 2s
      timeout: 5s
      retries: 30
